name: Run AFK Bot

on:
  workflow_dispatch:
  schedule:
    # Test ke liye har 2 minute par trigger (Baad mein isko '0 */5 * * *' kar dena)
    - cron: '*/2 * * * *'

concurrency:
  group: afk-bot-group
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Test ke liye timeout 5 minute rakh diya hai
    timeout-minutes: 5 

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start Minecraft Bot
        run: node index.js
        
