name: Run AFK Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *' # Har 5 ghante par auto-restart

# Agar nayi run start ho, toh purani run ko gracefully cancel karega
concurrency:
  group: afk-bot-group
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 320 # 5 ghante 20 minute ke baad safe auto-close

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start Minecraft Bot
        run: node index.js
        
