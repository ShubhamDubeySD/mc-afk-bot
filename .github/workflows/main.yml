name: Run AFK Bot

concurrency:
  group: mc-bot
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # Har 4 ghante 30 minute par auto-trigger (6 ghante ki limit aane se pehle hi naya bot bhej dega)
    - cron: '30 */4 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 320 # 5 ghante 20 minute safe cutoff limit

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start Minecraft Bot
        run: node index.js
        
